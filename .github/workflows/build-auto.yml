name: Build StudyTracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager "platform-tools"
          yes | sdkmanager "platforms;android-36"
          yes | sdkmanager "build-tools;36.0.0"

      # 创建 Cordova 项目
      - name: Create Cordova project
        run: cordova create app com.leilei.studytracker 学习监督

      # 复制代码
      - name: Copy project files
        run: |
          rm -rf app/www/*
          cp www/index.html app/www/index.html
          cp config.xml app/config.xml
          cp studytracker.keystore app/

          if [ -d resources ]; then
            cp -r resources app/
          fi

      # 添加 Android 平台
      - name: Add Android platform
        working-directory: app
        run: cordova platform add android@12

      # 修复 Gradle
      - name: Fix Gradle version
        working-directory: app/platforms/android
        run: gradle wrapper --gradle-version 8.7

      # 构建 APK
      - name: Build Release
        working-directory: app
        run: |
          cordova build android --release -- \
          --keystore=studytracker.keystore \
          --storePassword=leilei \
          --alias=studytracker \
          --password=leilei

      # 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-APK
          path: app/platforms/android/app/build/outputs/**/*.apk

      # 上传 AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-AAB
          path: app/platforms/android/app/build/outputs/**/*.aab
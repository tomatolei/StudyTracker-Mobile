name: Build StudyTracker APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova@12

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK Packages
      run: |
        yes | sdkmanager "platform-tools"
        yes | sdkmanager "platforms;android-34"
        yes | sdkmanager "build-tools;34.0.0"

    - name: Prepare App
      run: |

        cordova create app com.leilei.studytracker 学习监督

        cd app

        rm -rf www/*

        cp ../www/index.html www/index.html

        cp ../config.xml .

        cp ../studytracker.keystore .

        if [ -d ../resources ]; then
          cp -r ../resources .
        fi

        cordova platform add android@12

        cd platforms/android

        # 固定 Gradle 版本 (解决 XmlParser 错误)
        gradle wrapper --gradle-version 8.7

        cd ../../

    - name: Build Release
      run: |

        cd app

        cordova build android --release -- \
        --keystore=studytracker.keystore \
        --storePassword=leilei \
        --alias=studytracker \
        --password=leilei

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StudyTracker-APK
        path: app/platforms/android/app/build/outputs/**/*.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: StudyTracker-AAB
        path: app/platforms/android/app/build/outputs/**/*.aab
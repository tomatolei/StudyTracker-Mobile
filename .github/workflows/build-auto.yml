name: Build StudyTracker APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova@12

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager "platform-tools"
        yes | sdkmanager "platforms;android-36"
        yes | sdkmanager "build-tools;36.0.0"

    - name: Prepare Cordova App
      run: |

        # 创建项目
        cordova create app com.leilei.studytracker 学习监督

        cd app

        # 替换网页
        rm -rf www/*
        cp ../www/index.html www/index.html

        # 复制配置
        cp ../config.xml .

        # 复制签名
        cp ../studytracker.keystore .

        # 复制资源
        if [ -d ../resources ]; then
          cp -r ../resources .
        fi

        # 添加 Android 平台
        cordova platform add android@12

        # 确认平台存在
        ls platforms

        # 修复 Gradle 版本
        cd platforms/android
        gradle wrapper --gradle-version 8.7
        cd ../../

    - name: Build Release APK
      run: |
        cd app

        cordova build android --release -- \
        --keystore=studytracker.keystore \
        --storePassword=leilei \
        --alias=studytracker \
        --password=leilei

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StudyTracker-APK
        path: app/platforms/android/app/build/outputs/**/*.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: StudyTracker-AAB
        path: app/platforms/android/app/build/outputs/**/*.aab
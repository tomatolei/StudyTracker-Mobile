name: Build StudyTracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Cordova
      run: npm install -g cordova@12

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Cordova project
      run: |
        cordova create app com.leilei.studytracker 学习监督
        cp config.xml app/config.xml
        cp -r www app/

    - name: Add Android platform
      run: |
        cd app
        cordova platform add android@12

    - name: Fix Gradle version
      run: |
        cd app/platforms/android
        sed -i 's/gradle-.*/gradle-8.7-bin.zip/' gradle/wrapper/gradle-wrapper.properties

    - name: Build APK
      run: |
        cd app
        cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StudyTracker-APK
        path: app/platforms/android/app/build/outputs/**/*.apk
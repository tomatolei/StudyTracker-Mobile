name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-36"
        sdkmanager "build-tools;36.0.0"

    - name: Restore Keystore
      run: |
        mkdir -p app
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/studytracker.keystore

    - name: Add Android platform if missing
      run: |
        cd app
        cordova platform add android@12 || true

    - name: Build Signed APK
      run: |
        cd app
        cordova build android --release -- \
          --keystore=studytracker.keystore \
          --storePassword=${{ secrets.KEYSTORE_PASSWORD }} \
          --alias=${{ secrets.KEY_ALIAS }} \
          --password=${{ secrets.KEY_PASSWORD }}

    - name: Upload APK and AAB
      uses: actions/upload-artifact@v4
      with:
        name: StudyTracker-APK
        # 自动匹配生成的 APK / AAB，无需 cd 到固定目录
        path: |
          app/platforms/android/app/build/outputs/**/*.apk
          app/platforms/android/app/build/outputs/**/*.aab
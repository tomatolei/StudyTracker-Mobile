name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - uses: actions/checkout@v4

    # 2️⃣ Setup Node
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # 3️⃣ Install Cordova
    - name: Install Cordova
      run: npm install -g cordova

    # 4️⃣ Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 5️⃣ Setup Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    # 6️⃣ Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-36"
        sdkmanager "build-tools;36.0.0"

    # 7️⃣ Prepare Cordova app
    - name: Prepare Cordova App
      run: |
        cordova create app com.leilei.studytracker 学习监督
        cd app
        rm -rf www/*
        cp -r ../www/* www/
        [ -f ../config.xml ] && cp ../config.xml .
        [ -d ../resources ] && cp -r ../resources .
        cordova platform add android@12

    # 8️⃣ Restore keystore from Secret
    - name: Restore Keystore
      run: |
        mkdir -p app
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/studytracker.keystore

    # 9️⃣ Build signed APK
    - name: Build Signed APK
      run: |
        cd app
        cordova build android --release \
          -- \
          --keystore=studytracker.keystore \
          --storePassword=${{ secrets.KEYSTORE_PASSWORD }} \
          --alias=${{ secrets.KEY_ALIAS }} \
          --password=${{ secrets.KEY_PASSWORD }}

    # 🔟 Upload APK / AAB
    - name: Upload APK and AAB
      uses: actions/upload-artifact@v4
      with:
        name: StudyTracker-APK
        path: |
          app/platforms/android/app/build/outputs/apk/release/*.apk
          app/platforms/android/app/build/outputs/bundle/release/*.aab
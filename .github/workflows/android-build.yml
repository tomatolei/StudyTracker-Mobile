name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    # Node
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20


    # 安装 Cordova
    - name: Install Cordova
      run: npm install -g cordova


    # Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    # Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3


    # 安装 SDK 34
    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"


    # 创建 Cordova 项目
    - name: Create Cordova App
      run: |
        cordova create app com.leilei.studytracker 学习监督
        cd app

        rm -rf www/*
        cp ../www/index.html www/index.html

        [ -f ../config.xml ] && cp ../config.xml .
        [ -d ../resources ] && cp -r ../resources .

        cordova platform add android@12


    # 复制 keystore
    - name: Copy Keystore
      run: |
        cp studytracker.keystore app/


    # 构建 Release APK
    - name: Build Signed APK
      run: |
        cd app
        cordova build android --release \
          -- \
          --keystore=studytracker.keystore \
          --storePassword=${{ secrets.KEYSTORE_PASSWORD }} \
          --alias=${{ secrets.KEY_ALIAS }} \
          --password=${{ secrets.KEY_PASSWORD }}


    # 上传 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 学习监督APK
        path: app/platforms/android/app/build/outputs/apk/release/*.apk
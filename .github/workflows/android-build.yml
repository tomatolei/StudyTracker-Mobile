name: Build Signed Android APK

env:
  APP_VERSION: 3.1
  APP_VERSION_CODE: 310
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: 34.0.0

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}"
        sdkmanager "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

    - name: Restore Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > studytracker.keystore

    - name: Install npm dependencies
      run: npm install

    - name: Ensure Android platform is installed
      run: |
        if [ ! -d "platforms/android" ]; then
          cordova platform add android@12
        else
          echo "Android platform already exists, skip add."
        fi

    - name: Build Signed APK
      run: |
        cordova build android --release -- \
          --packageType=apk \
          --keystore=studytracker.keystore \
          --storePassword=${{ secrets.KEYSTORE_PASSWORD }} \
          --alias=${{ secrets.KEY_ALIAS }} \
          --password=${{ secrets.KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StudyTracker-APK-v${{ env.APP_VERSION }}
        path: |
          platforms/android/app/build/outputs/**/*.apk

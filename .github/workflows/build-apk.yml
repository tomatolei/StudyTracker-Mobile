name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 新增：安装Java 17（Cordova Android 11要求）
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
    
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
    
      - name: Install fixed version Cordova
        run: npm install -g cordova@12.0.0
    
      - name: Build APK
        run: |
          cordova create app com.leilei.studytracker 学习监督
          cd app
          rm -rf www/*
          cp ../www/index.html www/index.html
          [ -f ../config.xml ] && cp ../config.xml .
          [ -d ../resources ] && cp -r ../resources .
          cordova platform add android@11.0.0
          cordova build android -- --gradleArg=-PcdvMinSdkVersion=23 --gradleArg=-PcdvTargetSdkVersion=33 --gradleArg=-PcdvCompileSdkVersion=33
    
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 学习监督APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

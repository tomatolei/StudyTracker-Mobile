name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
    
      - name: Install Cordova
        run: npm install -g cordova
    
      - name: Create and Build App
        run: |
          cordova create app com.leilei.studytracker 学习监督
          cd app
          
          # Remove default www folder and copy our files
          rm -rf www/*
          cp ../www/index.html www/index.html
          
          # Copy config.xml
          cp ../config.xml config.xml
          
          # Copy icon if exists
          if [ -d ../resources/android/icon ]; then
            mkdir -p resources/android/icon
            cp ../resources/android/icon/* resources/android/icon/
          fi
          
          # Add Android platform
          cordova platform add android@12.0.0
          
          # Set Gradle options
          export ORG_GRADLE_PROJECT_cdvMinSdkVersion=22
          export ORG_GRADLE_PROJECT_cdvTargetSdkVersion=33
          export ORG_GRADLE_PROJECT_cdvCompileSdkVersion=34
          
          # Build with Gradle
          cd platforms/android
          ./gradlew cdvBuildDebug -PcdvMinSdkVersion=22 -PcdvTargetSdkVersion=33 -PcdvCompileSdkVersion=34
    
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

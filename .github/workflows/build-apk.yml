name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04 # 最稳定的旧版系统，自带Gradle 7.x，完全兼容
    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Java 11 # 和Gradle 7完全匹配，不会有版本问题
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
    
      - name: Setup Node 16 # 稳定兼容Cordova 10
        uses: actions/setup-node@v4
        with:
          node-version: '16'
    
      - name: Install Cordova 10.0.0 # 最稳定的Cordova版本，无兼容性问题
        run: npm install -g cordova@10.0.0
    
      - name: Build APK
        run: |
          cordova create app com.leilei.studytracker 学习监督
          cd app
          rm -rf www/*
          cp ../www/index.html www/index.html
          [ -f ../config.xml ] && cp ../config.xml .
          [ -d ../resources ] && cp -r ../resources .
          # 使用最稳定的Android 9.1.0平台，完全兼容Gradle 7
          cordova platform add android@9.1.0
          cordova build android --release -- --keystore=../debug.keystore --storePassword=android --alias=androiddebugkey --password=android
    
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 学习监督APK
          path: app/platforms/android/app/build/outputs/apk/release/app-release.apk

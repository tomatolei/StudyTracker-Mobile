name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
    
      - name: Install Cordova
        run: npm install -g cordova

      - name: Create App
        run: |
          cordova create app com.leilei.studytracker 学习监督
          cd app
          rm -rf www/*
          cp ../www/index.html www/index.html
          cordova platform add android

      - name: Fix SDK Version
        run: |
          cd app
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 36/g' platforms/android/app/build.gradle
          sed -i 's/targetSdkVersion = 33/targetSdkVersion = 36/g' platforms/android/app/build.gradle

      - name: Build APK
        run: |
          cd app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 学习监督APK
          path: app/platforms/android/app/build/outputs/apk/release/app-release.apk
